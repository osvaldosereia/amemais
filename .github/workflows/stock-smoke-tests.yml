name: Estoque - testes de interface
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxe dos módulos críticos
        run: |
          node --check src/app.js
          node --check src/product-card-workspace.js
          node --check src/stock-workflows.js
          node --check src/catalog-transfer.js
          node --check src/stock-workflows.js
          node --check src/shelf-labels.js
          node --check src/sku-panel.js
      - name: Validar cards, movimentações e remessas
        run: node --test tests/*.test.mjs
